name: streamforge-platform
x-app-env: &app-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://s3:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Run make init}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?Run make init}
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run make init}
services:
  postgres:
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: streamforge
      POSTGRES_DB: streamforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make init}
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U streamforge -d streamforge"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.8.2
    command: [redis-server, --save, "", --appendonly, "no"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
  s3:
    image: chrislusf/seaweedfs:4.46
    command: [mini, -dir=/data, -s3.port=8333, -volume.max=4]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Run make init}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Run make init}
      S3_BUCKET: streamforge-raw
    ports: ["127.0.0.1:18333:8333"]
    volumes: ["s3-data:/data"]
  api:
    image: streamforge-api:dev
    build:
      context: .
      target: base
    environment: *app-env
    ports: ["127.0.0.1:18000:8000"]
    volumes: ["./app:/workspace/app:ro"]
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, "8000", --reload]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      s3: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=10)"]
      interval: 5s
      timeout: 12s
      retries: 30
      start_period: 15s
  tests:
    profiles: [tools]
    image: streamforge-tests:dev
    build:
      context: .
      target: test
    environment: *app-env
    command: [sh, -c, "ruff check app scripts tests migrations && pytest -q tests/unit"]
  clickhouse:
    profiles: [analytics]
    image: clickhouse/clickhouse-server:26.8.2.7
    environment:
      CLICKHOUSE_DB: streamforge
      CLICKHOUSE_USER: streamforge
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run make init}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports: ["127.0.0.1:18123:8123", "127.0.0.1:19000:9000"]
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user streamforge --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
  airflow-db:
    profiles: [analytics]
    image: postgres:17.11-trixie
    environment:
      POSTGRES_USER: airflow
      POSTGRES_DB: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?Run make init}
    volumes: ["airflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
  airflow:
    profiles: [analytics]
    image: apache/airflow:3.3.1-python3.12
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?Run make init}@airflow-db/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET:?Run make init}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_SECRET:?Run make init}
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: mentor:admin
    ports: ["127.0.0.1:18080:8080"]
    volumes: ["./dags:/opt/airflow/dags:ro", "airflow-home:/opt/airflow"]
    depends_on:
      airflow-db: {condition: service_healthy}
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "curl --fail http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
volumes:
  postgres-data:
  s3-data:
  clickhouse-data:
  airflow-db:
  airflow-home:
