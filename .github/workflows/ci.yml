name: infrastructure
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/bootstrap.py
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose --profile tools build tests
      - run: docker compose --profile tools run --rm tests
      - run: docker compose exec -T api alembic upgrade head
      - run: docker compose exec -T api python -m scripts.smoke
      - run: curl --fail http://127.0.0.1:18000/ready
      - if: always()
        run: docker compose logs --no-color --tail 100
      - if: always()
        run: docker compose --profile tools down -v
