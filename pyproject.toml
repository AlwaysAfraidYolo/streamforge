[project]
name = "streamforge"
version = "0.1.0"
description = "Learning data platform infrastructure"
requires-python = ">=3.14,<3.15"
dependencies = [
 "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5",
 "pydantic-settings==2.15.0", "sqlalchemy[asyncio]==2.0.52",
 "asyncpg==0.31.0", "alembic==1.19.2", "redis==8.1.0",
 "boto3==1.43.91", "httpx==0.28.1",
]
[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.7"]
[tool.uv]
package = false
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs running Compose services"]
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["work", ".venv"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
